name: Build APK

on:
  push:
    branches: [aaudio-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.0.12077973" "platforms;android-36" > /dev/null

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleNonRoot_gameDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: artemis-aaudio-apks
          path: app/build/outputs/apk/**/*.apk
